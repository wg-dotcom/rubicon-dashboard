name: Sync Rubicon data

# Rebuilds rubicon-data.json from both Google Sheets.
# Three ways to run:
#   1. Instantly, when the Sheets onChange trigger pings repository_dispatch.
#   2. On a schedule: Mon / Wed / Fri at 8am ET (see the gate job for the DST-safe logic).
#   3. Manually, via the "Run workflow" button.
# No secrets needed for data: the sheets are link-readable and the built-in token commits.

on:
  repository_dispatch:
    types: [sheet-changed]    # fired instantly by the Sheets onChange trigger
  schedule:
    # GitHub cron is UTC only and never observes DST, so we fire at BOTH candidate
    # hours (12:00 and 13:00 UTC) on Mon/Wed/Fri, then the gate job below keeps only
    # the run that lands on 08:00 America/New_York. Result: exactly 8am ET year-round.
    - cron: "0 12,13 * * 1,3,5"
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync-rubicon
  cancel-in-progress: false

jobs:
  # Decide whether the sync should run. Non-schedule events always pass.
  # Schedule events pass only at 08:00 America/New_York, so DST never shifts the hour.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          h=$(TZ=America/New_York date +%H)
          echo "America/New_York hour: $h"
          if [ "$h" = "08" ]; then echo "run=yes" >> "$GITHUB_OUTPUT";
          else echo "run=no (not 8am ET)" ; echo "run=no" >> "$GITHUB_OUTPUT"; fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch all three sheets
        run: |
          set -e
          curl -fsSL "https://docs.google.com/spreadsheets/d/1swUUYMpyb5e9zocbONdhqH1ahg53jaQTXM6jyVKXqmc/gviz/tq?tqx=out:csv&sheet=Master%20Candidate%27s%20Data%20Base" -o cand.csv
          curl -fsSL "https://docs.google.com/spreadsheets/d/1pKvIJlav4FvYQa4HqOusb0yhfinI-1XaQbESZ-vjMfI/export?format=csv&gid=1378398655" -o trk.csv
          curl -fsSL "https://docs.google.com/spreadsheets/d/1mCiKfumGCIaDxeG5Z3JMUXKg2bioKwgsaQbRFR4fFpk/export?format=csv" -o bg.csv
          echo "candidates $(wc -c < cand.csv) / tracker $(wc -c < trk.csv) / bgchecks $(wc -c < bg.csv) bytes"

      # Anonymize any NEW candidates' CVs into branded pages. Skips automatically
      # if ANTHROPIC_API_KEY isn't set, so the data sync keeps working without it.
      - name: Anonymize new CVs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY set — skipping CV anonymization (data still syncs)."
            exit 0
          fi
          pip install --quiet anthropic pypdf
          python3 anonymize_cvs.py cand.csv cvs cv_map.json

      - name: Build rubicon-data.json
        run: python3 build_data.py cand.csv trk.csv bg.csv rubicon-data.json

      - name: Commit if changed
        run: |
          rm -f cand.csv trk.csv bg.csv
          git add -A cvs cv_map.json rubicon-data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "rubicon-sync-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-sync Rubicon data + CVs: $(date -u +%FT%TZ)"
            git push
          fi
